plugins { id 'com.android.application' }

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('signing.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}

android {
    namespace 'cn.suishi.calendar'
    compileSdk 35
    buildFeatures { buildConfig true }
    testBuildType 'release'
    defaultConfig {
        applicationId 'cn.suishi.calendar'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
        testInstrumentationRunner 'cn.suishi.calendar.CalendarSmokeTest'
    }
    signingConfigs {
        release {
            if (releasePropertiesFile.exists()) {
                storeFile rootProject.file(releaseProperties['storeFile'])
                storePassword releaseProperties['storePassword']
                keyAlias releaseProperties['keyAlias']
                keyPassword releaseProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
